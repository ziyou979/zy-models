# zy-models: validate + build on every push to main, then publish dist/ to the
# `dist` branch (served by GitHub raw and jsDelivr gh). Upstream workflows in this
# folder are guarded by `github.repository == 'anomalyco/models.dev'` and skip here.
name: zy-models build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zy-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'ziyou979/zy-models'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Validate
        run: bun scripts/zy-validate.ts > /tmp/validate.json
      - name: Upstream files unchanged
        # Every upstream file except LICENSE (and upstream's .github/workflows/) must be byte-for-byte upstream, so the
        # daily upstream merge can't conflict on our edits (docs/upstream-sync.md).
        run: |
          git fetch -q --no-tags https://github.com/anomalyco/models.dev.git dev
          base=$(git merge-base HEAD FETCH_HEAD)
          # Upstream's own workflows are exempt: the sync keeps our version of them
          # because GITHUB_TOKEN may not push workflow changes (scripts/sync-keep-workflows.sh).
          changed=$(git diff --name-only --diff-filter=M "$base" HEAD | grep -v -x -e LICENSE | grep -v -E '^\.github/workflows/' || true)
          skipped=$(git diff --name-only "$base" HEAD -- .github/workflows/ | grep -v -E '^\.github/workflows/zy-' || true)
          if [ -n "$skipped" ]; then
            echo "::notice::Upstream workflow files kept at this repo's version (upstream changes not adopted): $(echo $skipped)"
          fi
          if [ -n "$changed" ]; then
            echo "::error::These upstream files were edited in place; move the change into overlays/ or a cn*/zy* file:"; echo "$changed"; exit 1
          fi
      - name: Test
        # Our tests + the upstream worker test. Upstream's data-dependent core tests
        # assert upstream's own catalog and already fail on this fork's data.
        run: bun test packages/function packages/core/test/cn-register.test.ts packages/core/test/cn-sync.test.ts
      - name: Build dist
        run: bun scripts/build-dist.ts
      - name: Build site
        working-directory: packages/web
        run: ./script/cn-build.ts
      - name: Size check
        run: ls -la dist dist/v2
      - name: Publish dist branch
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cd dist
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ../LICENSE . && cp ../.github/README.md README.md
          git add -A
          git commit -q -m "dist: build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" dist:dist
