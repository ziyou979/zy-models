schema = 2
base_model = "minimax/MiniMax-M3"
sources = ["https://ai.youdao.com/new/token", "https://ai.youdao.com/DOCSIRMA/html/token/price/modelprice/"]
checked_at = "2026-11-13"
notes = "上下文取平台 maxContextLength=1000000（十进制原值）；最大输出未公开。平台默认限流：总 TPM 50000000 / RPM 50000，单应用 TPM 5000000 / RPM 5000。『多模态』标签仅表示支持多模态输入，图像/视频具体范围未写明（此处按图像输入记，推断）。计费项原文：标准输入Token（未命中缓存读写，且0<输入≤512K）=4.2；标准输出Token（0<输入≤512K）=16.8；缓存读Token（0<输入≤512K）=0.84；标准输入Token（未命中缓存读写，且输入>512K）=8.4；标准输出Token（输入>512K）=33.6；缓存读Token（输入>512K）=1.68。"

[capabilities]
reasoning = { supported = true }

[limit]
context = 1_000_000

[cost.text.input]
price = 0.62819736

[cost.text.input.cache]
read = 0.12563947

[cost.text.output]
price = 2.51278943

[cost_cny]
