quota_note = "按请求次数流控：高效版每 5 小时约 6,000 次 / 每周约 45,000 / 每月约 90,000；速通版每月约 30,000 次（首月 ¥699/月、首季 ¥2697）。无忧版 ¥19、专业版 ¥39 已下线。波谷系数：工作日 22:00–次日 08:00、周末、节假日按 0.8 计。2026-07-23 起按模型抵扣系数扣次（Spark X2/X2 Agent 2、X2-Flash 1、GLM-5.2 5、DeepSeek-V4-Pro 5、Kimi-K2.7-Code 5 等）。仅限编程工具交互式场景，禁止自动化脚本/自建后端。官方文档把 Responses 与 Anthropic 两个地址写反了（Anthropic 实为 …/anthropic，Responses 实为 …/v1/responses）。统一 model 名 astron-code-latest，底层模型在控制台切换。"
