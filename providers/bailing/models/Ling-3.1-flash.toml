# Imported from research/ant-ling.json by scripts/import-research.ts (checked 2026-11-12)
# Source: https://developer.ant-ling.com/zh-CN/docs/models/ling/
# Source: https://developer.ant-ling.com/zh-CN/docs/models/price/
# Source: https://developer.ant-ling.com/zh-CN/docs/api-reference/chat/openai/
# Prices: CNY per 1M tokens from the official pricing page, converted to USD (rate 6.685797 CNY/USD, 2026-11-12, https://open.er-api.com/v6/latest/USD).
# CNY: input 0.5, output 1.5, cache_read 0.1
schema = 2
base_model = "inclusionai/ling-3.1-flash"
sources = ["https://developer.ant-ling.com/zh-CN/docs/models/ling/", "https://developer.ant-ling.com/zh-CN/docs/models/price/", "https://developer.ant-ling.com/zh-CN/docs/api-reference/chat/openai/"]
checked_at = "2026-11-12"
notes = "560B / 25B 激活，长流程 Agent 混合推理。官方对 2.6 系列的推荐替代。release_date 仅知 2026.10（演进表）。"

[capabilities]
reasoning = { supported = true, toggle = true, default = { type = "toggle", value = true } }
structured_output = true

[limit]
context = 1_048_576

[cost.text.input]
price = 0.0747854

[cost.text.input.cache]
read = 0.01495708

[cost.text.output]
price = 0.2243562

[cost_cny]
input = 0.5
output = 1.5
cache_read = 0.1
discount_note = "当前 2.5 折；原价 输入 ¥2 / 输出 ¥6 / 缓存 ¥0.4"

[reasoning_default]
value = "on"
source = "https://developer.ant-ling.com/zh-CN/docs/api-reference/chat/openai/"
