quota_note = "每订阅月 Tokens：Lite 5000万 / Standard 1.3亿 / Pro 3.8亿 / Max 8.8亿。每日限量发售，售罄当天不可购买；同一用户每月限购一次；仅支持升配不支持降配；有效期按自然月，未用完额度到期作废；Max 用量耗尽后可切换按需付费；不支持退订。仅支持『西南-贵阳一』；企业用户暂不支持购买个人版。『套餐额度仅在AI工具中生效，不可用于API调用。在非AI工具中使用MaaS Token Plan权益对应的专属Base URL和API Key可能会被识别为滥用或违规行为，导致订阅停用或账号封禁。』支持工具：华为云码道(CodeArts)、果办OfficeAce、Claude Code、OpenClaw、OpenCode、Cherry Studio、TRAE、Dify 等。"
usage_restriction = "订阅套餐额度仅限在官方支持的编程工具 / Agent 中交互使用，禁止当作普通 API（自建应用、批量或程序化调用）使用；违规可能被限流或封禁。具体条款见 sources。"
