notes = "中国站模型均部署在『西南-贵阳一』，需先在控制台『模型推理>在线推理>预置服务』开通对应模型预置服务后用 API Key 调用。分时计费：北京时间 08:00-20:59 为时段1、21:00-次日07:59 为时段2，仅部分模型支持（GLM-5.2/5.1、Kimi-K2.6、DeepSeek 系列），时段2约为7折或5折；价格『具体以MaaS控制台为准』。上下文缓存自动开启，无需配置。思考开关：V2/OpenAI 接口用 thinking.type(enabled/disabled)，思维链在 reasoning_content；多轮对话中 reasoning_content 回传会被忽略。表 1-3 写所有模型默认开启思维链（GLM-5.3 不支持关闭）。max_tokens 默认：DeepSeek-V4.1 系列 64K，Kimi-K2.6/openPangu-2.0 32K，其他 4K。各模型 TPM/RPM 默认限流见各模型 notes。模型列表页 2026-09 版曾列 deepseek-v4-pro、glm-5、DeepSeek-V3（Anthropic 页残留），当前列表未列，未收录。实名/备案要求：本次未在 MaaS 文档中找到专门说明。"

[[plans]]
id = "token-plan"
name_zh = "MaaS Token Plan 个人版"
