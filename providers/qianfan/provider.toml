name = "Baidu AI Cloud Qianfan"
env = ["QIANFAN_API_KEY"]
npm = "@ai-sdk/openai-compatible"
opencodeai = "@opencode/ai/providers/openai-compatible"
api = "https://qianfan.baidubce.com/v2"
doc = "https://cloud.baidu.com/doc/qianfan/s/rmh4stp0j"
name_zh = "百度智能云千帆（百度千帆·大模型服务及Agent开发平台）"
region = "cn"
pricing_page = "https://cloud.baidu.com/doc/qianfan/s/wmh4sv6ya"
notes = "文心 ERNIE 4.x/X1/5.0 等旧模型已不在当前模型列表与价格页，故未收录。价格页单位为元/千 tokens，已×1000 换算为元/百万 tokens。千帆峰谷时段（高峰 8:00-22:00）与火山方舟/腾讯（工作日 9-12、14-18）不同。鉴权为千帆 API Key（Bearer bce-v3/ALTAK-...）；Anthropic 接口用 x-api-key，可加 appid 头。千帆官方文档未指定 API Key 环境变量名，env 留空。tools：仅函数调用文档支持清单内的模型（ERNIE 5.5-Flash-Preview / Light-DT / 5.1 等）记 true，清单尚未更新至 DeepSeek-V4/GLM-5.x，记 null；structured_output 同理按结构化输出文档清单。上下文 K 按 1024 换算（1M=1048576）。"

[[plans]]
id = "token-plan"
name_zh = "千帆 Token Plan 个人版"
price_cny_month = 9.9
base_url = "https://qianfan.baidubce.com/v2/tokenplan/personal"
protocol = "openai-chat"
models = ["qianfan-code-latest", "ernie-5.5-flash-preview", "ernie-light-dt-1.0", "deepseek-v4.1-flash-1017", "deepseek-v4.1-flash", "deepseek-v4-pro", "deepseek-v4-pro-0813", "deepseek-v4-flash-0731", "glm-5.3", "glm-5.3-flash", "glm-5.2", "glm-5.1"]
quota_note = "档位（元/月）：Mini 9.9（Token 制 1000 万 tokens / 积分制 1400 积分）、Lite 39（4200 万 / 11500）、Standard 100（仅积分制 22000）、Pro 200（2.3 亿 / 45000）、Max 600（7 亿 / 165000）。Token 制不区分输入/输出/缓存；积分制按 token 类型分别设抵扣系数。积分制有 5 小时与 7 天限制（当前限时取消）。Anthropic 基址 https://qianfan.baidubce.com/anthropic/tokenplan/personal；专属 API Key；仅限 AI 工具交互使用；不支持退费。可用 qianfan-code-latest 由控制台选模型。限时：DeepSeek-V4.1-Flash / V4-Pro-0813 / GLM-5.3 每日 22:00-8:00 2 折（至 2026-11-30）；ERNIE-5.5-Flash-Preview 日间 5 折、夜间 2.5 折（至 2026-11-30）；双十一首购 5 折（2026-11-06 至 11-23）。部分模型（ERNIE-5.5-Flash-Preview、ERNIE-Light-DT、DeepSeek-V4.1-Flash-1017）仅积分制可用。"
usage_restriction = "订阅套餐额度仅限在官方支持的编程工具 / Agent 中交互使用，禁止当作普通 API（自建应用、批量或程序化调用）使用；违规可能被限流或封禁。具体条款见 sources。"
sources = ["https://cloud.baidu.com/doc/qianfan/s/Dmrabu8b6"]

