doc = "https://docs.infini-ai.com/gen-studio/"
name_zh = "无问芯穹 GenStudio 大模型服务平台"
region = "cn"
pricing_page = "https://docs.infini-ai.com/gen-studio/api/usage-and-billing/billing.html"
notes = "模型广场与服务列表（含上下文长度、最大输出、单价、Claude 兼容/函数调用标签、支持芯片）均需登录，公开文档也明确价格只在服务列表/模型卡片展示，故本文件 limit 与 price_cny 基本为 null；模型 ID 与思考参数均取自公开 Reasoning 教程（2026-11 版）与上线/下架公告。计费：自 2026-03-30 起预置 LLM API 一律按 Token 后付费（体验中心网页端免费），每自然小时出账；2026-06-01 起部分模型支持被动缓存，命中部分优惠价计费。服务等级限频：基础服务 RPM 12 / RPD 300 / TPM 12,000（租户内所有 Key 共享），高级服务 RPM 1,200 / RPD 不限 / TPM 1,200,000（可自助升级，升级后不可降级），企业服务可定制；不排队，超限直接 429。嵌入与重排序 API 免费。视觉输入仅接受 BASE64（不支持 URL），单文件 5MB，单图/视频最多读取 16384 token。产品支持多种国产芯片推理（M×N）。未发现编程套餐/Coding Plan。实名认证要求未在公开文档中找到原文。"

[[plans]]
