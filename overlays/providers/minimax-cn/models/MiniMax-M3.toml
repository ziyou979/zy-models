# zy-models overlay for providers/minimax-cn/models/MiniMax-M3.toml (generated by scripts/import-research.ts)
sources = ["https://platform.minimaxi.com/docs/guides/text-generation", "https://platform.minimaxi.com/docs/api-reference/text-chat-openai", "https://platform.minimaxi.com/docs/api-reference/text-anthropic-api", "https://platform.minimaxi.com/docs/pricing/overview", "https://platform.minimax.io/docs/pricing/overview", "https://platform.minimaxi.com/docs/release-notes/models"]
checked_at = "2026-11-12"
notes = "reasoning_effort 对 M3 无效（被忽略）。官方两处默认值矛盾：OpenAI 兼容接口文档称 thinking 默认 adaptive（开启），可传 disabled 关闭；Anthropic 兼容文档称省略 thinking 时关闭、传 adaptive 开启。故 default 记为 null。支持 service_tier=priority（1.5 倍价）。output 上限 524288 出自 OpenAI 接口 max_completion_tokens 说明。"

