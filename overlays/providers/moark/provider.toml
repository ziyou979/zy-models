notes = "价格与标签取自模力方舟模型广场详情抽屉（价格（每百万 Token）：输入/输出/缓存命中/缓存创建），并与公开接口 GET https://api.moark.com/v1/models?include_details=true（input_million_tokens_price/output_million_tokens_price）交叉核对。上下文/最大输出只以 K/M 标签展示，limit 记 null，原文见 limit_label。Serverless API 为公共资源池，FAQ：『当前 Serverless API 不单独限制并发』，详情页『并发数不限制，根据负载动态调整』；免费体验访问令牌每位用户每日 100 次免费调用；标注免费的模型需先购买任意金额全模型资源包。公开接口 GET /v1/models/capabilities 返回各模型 default_reasoning_level/supported_reasoning_levels（low/medium/high），但内容为 Codex 适配配置（base_instructions 为『You are Codex, a coding agent.』），未作为模型思考档位采信。账号使用 Gitee 登录，公开页面未见实名认证要求原文。另有 Intern-S2（限时免费）、Qwen3.6-Plus、qwen3.8-27b、Kimi-K2.6 等未纳入。"

