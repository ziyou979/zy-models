notes = "price_cny 取华北2（北京）原价；price_usd_intl 取国际站新加坡（International 部署范围）美元价（https://www.alibabacloud.com/help/en/model-studio/model-pricing）。中文价格页把新加坡价折成人民币（如 qwen3.8-max 14.988/44.965 元），未采用。阶梯按单次请求输入 token 总量整体定档（K=1000、M=1000000）。缓存：隐式缓存命中通常按输入单价 20%，显式缓存创建 125%、命中 10%；qwen3.8-max 与 qwen3.8-flash 为例外（比例不同、以控制台为准），故各模型 cache_read 除官方明列者（kimi-k3.1-pro 1.3 元、qwen3.8-omni-flash 0.1 元）外写 null。Batch 半价（部分模型）。新开通 90 天内北京地域多数新模型各有 100 万 token 免费额度。思考：Qwen3.5 及以后的 Plus/Max/Flash 均为混合思考、默认开启，用 enable_thinking 开关，thinking_budget 限制思考长度（不是档位）；qwen4-max-preview 用 reasoning_effort=low/medium/xhigh（默认 xhigh），且 max_tokens 起含思考与回答总量、preserve_thinking 默认开；glm-5.3 仅思考；kimi-k3.1-pro 在百炼文档中写“混合思考、默认开启”（与月之暗面官方“始终思考”不一致），kimi/kimi-k3.1-pro 等月之暗面直供版本为仅思考；kimi-k3.1-pro、kimi-k3 不支持 thinking_budget。qwen4-max-preview 仅 Token Plan 可用，预览期至 2026-11-25 24:00 后下线，无按量价。百炼 deepseek-v4-pro（非 0813 快照）按 12/24 元固定价，与 deepseek-v4-pro-0813 峰谷价不同，未单列。三方直供模型（如 kimi/kimi-k3.1-pro-highspeed、ZHIPU/GLM-5.3-Flash 等）仅中国站北京地域可用，需在控制台开通。地域：北京（cn）、新加坡（intl）、美国弗吉尼亚、德国法兰克福、日本东京、中国香港；API Key 按地域绑定，跨地域调用返回 401。推荐迁移至业务空间专属域名 {WorkspaceId}.<region>.maas.aliyuncs.com，旧域名 dashscope.aliyuncs.com / dashscope-intl.aliyuncs.com 仍可用。qwen3.8-max 等 max output 128k 取自“图像与视频参数”表；qwen3.7-flash 64k 取自旧版表。release_date 官方未给出（快照名中的日期见 aliases）。"
