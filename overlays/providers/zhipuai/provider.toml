notes = "价格单位 元/百万 tokens；缓存存储（元/百万 tokens/小时）当前全部“限时免费”，故 cache_write 写 null；Batch API 为标准价 5 折。price_usd_intl 取自 z.ai 国际站价格页（glm-5-turbo、glm-5v-turbo 国际站未列价，写 null）。思考：GLM-5.3 与 GLM-5.3-Flash/FlashX 强制思考、不能关闭（thinking.type=disabled 会报错）；reasoning_effort 仅 GLM-5.2 及以上支持，默认 max，low 仅 GLM-5.3 支持（GLM-5.2 另接受 xhigh/medium/low/minimal/none 并映射，none/minimal=放弃思考）。GLM-5.2/5.1/5/5-Turbo/5V-Turbo/4.6/4.6V/4.5 的 thinking.type 默认 enabled，为模型自动判断是否思考（动态）；GLM-4.7 系列默认开启（强制思考，可 disabled 关闭）。保留式思考在 Coding Plan 端点默认开、标准 API 端点默认关（clear_thinking=false 开启）。glm-5.3-flash 官方称首个采用稀疏+线性注意力混合架构的开源前沿模型（320B 总参/18B 激活），open_weights=true 依据此；其余模型 open_weights 未在本平台文档确认，写 null。GLM-5.3-Flash 输入模态含文件（pdf 字段表示“文件”）。另有 glm-5.3-flashx-legal（法律场景，价格同 FlashX）未单列。glm-4.7-flash、glm-4.5-flash、glm-4-flash-250414、glm-4.6v-flash 等为免费模型。GLM-4.7 / GLM-4.5-Air 的阶梯同时取决于输出长度（输出 <0.2K 与 ≥0.2K）。官方只给出“1M/200K/128K/96K/32K”字符串，limit 中统一按 K=1000、M=1000000 字面换算（未核实是否为 1024 进制）。注意：订阅过 GLM Coding Plan（含已过期）的账号目前只能通过 OpenAI Chat Completion 协议调用标准模型 API。自 2026-10-16 起标准 API 与 Coding Plan 的 API Key 分开管理。z.ai 的 GLM-5.3 文档在“Model API”表里写的 Chat 端点是 https://api.z.ai/api/coding/paas/v4（与 quick-start 中 /api/paas/v4 不一致），此处以 quick-start 为准。官方文档未指定 API Key 环境变量名，env 留空。团队版：国内标准席位 ¥598/月（每周 66,000 积分）、高级席位 ¥1198/月（每周 155,000 积分）；z.ai 团队 $88 / $188 每席位每月。发布日期官方文档未给出。"
