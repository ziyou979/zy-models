# zy-models overlay for providers/zhipuai/models/glm-4.5-air.toml (generated by scripts/import-research.ts)
sources = ["https://docs.bigmodel.cn/cn/guide/models/text/glm-4.5", "https://docs.bigmodel.cn/cn/guide/start/pricing", "https://docs.bigmodel.cn/cn/guide/start/model-overview", "https://docs.bigmodel.cn/cn/guide/capabilities/thinking", "https://docs.z.ai/guides/overview/pricing"]
checked_at = "2026-11-12"

[cost_cny]
input = 0.8
output = 2
cache_read = 0.16

[[cost_cny.tiers]]
when = "input<32k && output<0.2k"
input = 0.8
output = 2
cache_read = 0.16

[[cost_cny.tiers]]
when = "input<32k && output>=0.2k"
input = 0.8
output = 6
cache_read = 0.16

[[cost_cny.tiers]]
when = "32k<=input<128k"
context_min = 32_000
context_max = 128_000
input = 1.2
output = 8
cache_read = 0.24

[reasoning_default]
value = "on"
source = "https://docs.bigmodel.cn/cn/guide/capabilities/thinking"
