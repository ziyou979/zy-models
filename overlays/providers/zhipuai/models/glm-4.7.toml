# zy-models overlay for providers/zhipuai/models/glm-4.7.toml (generated by scripts/import-research.ts)
sources = ["https://docs.bigmodel.cn/cn/guide/models/text/glm-4.7", "https://docs.bigmodel.cn/cn/guide/start/pricing", "https://docs.bigmodel.cn/cn/guide/start/model-overview", "https://docs.bigmodel.cn/cn/guide/capabilities/thinking", "https://docs.bigmodel.cn/cn/guide/capabilities/thinking-mode", "https://docs.z.ai/guides/overview/pricing"]
checked_at = "2026-11-12"

[cost_cny]
input = 2
output = 8
cache_read = 0.4

[[cost_cny.tiers]]
when = "input<32k && output<0.2k"
input = 2
output = 8
cache_read = 0.4

[[cost_cny.tiers]]
when = "input<32k && output>=0.2k"
input = 3
output = 14
cache_read = 0.6

[[cost_cny.tiers]]
when = "32k<=input<200k"
context_min = 32_000
context_max = 200_000
input = 4
output = 16
cache_read = 0.8

[reasoning_default]
value = "on"
source = "https://docs.bigmodel.cn/cn/guide/capabilities/thinking-mode"
