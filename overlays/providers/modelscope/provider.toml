# zy-models overlay for providers/modelscope/provider.toml (generated by scripts/import-research.ts)
name_zh = "魔搭社区 API-Inference"
region = "cn"
pricing_page = "https://www.modelscope.cn/docs/magicube/intro"
notes = "计费说明：魔搭 API-Inference 按「魔粒」（平台积分）计费，不以人民币标价，因此本库不列人民币价（cost_cny 留空）。\n\n模型清单取自公开接口 GET https://api-inference.modelscope.cn/v1/models（无需鉴权，共 38 个，含文生图等，本文件仅列主力对话/代码/视觉模型）；模型 id 即魔搭 Model-Id（组织/模型名）。官方未公布 API-Inference 侧的上下文长度、最大输出、工具调用与思考参数（文档要求『以模型页面右侧 API-Inference 示例代码为准，尤其是推理模型』），故 limit/tools/reasoning 均为 null；price_cny 不适用（免费 + 魔粒）。前置条件：ModelScope 账号须绑定阿里云账号，且该阿里云账号完成实名认证后才能使用 API-Inference。API-Provider：可在个人中心托管外部提供方（如 DashScope、DeepSeek）的 API Key，调用时 model 写成『Model-Id:提供方名』（如 Qwen/Qwen3-1.7B:DashScope），仍用魔搭 Token 鉴权（https://www.modelscope.cn/docs/model-service/API-Inference/api-provider）。随着新模型推出，旧模型会逐步从 API-Inference 下架。旧版『每日 2000 次免费』规则已不见于当前文档，现行为魔粒体系。"

[[plans]]
id = "magicube"
name_zh = "魔粒（Magic Cube）额度"
price_cny_month = 0
base_url = "https://api-inference.modelscope.cn/v1"
protocol = "openai-chat"
quota_note = "免费：注册并登录 200 魔粒/日（短期，当日有效）、绑定阿里云账号再 +50 魔粒/日；另有验证邮箱等长期魔粒（90 天）。API-Inference 每次调用按模型规模扣：轻量 0.5、主流 1、旗舰 2 魔粒/次（平均值）；魔粒余额充足即可调用任意次数。使用魔粒需先完善个人信息（含邮箱验证）。限制原文：『API-Inference 本身为非商业化，非盈利产品』『请勿用于需要高并发以及SLA保障的线上任务，如有商业化使用的需求，建议使用各商业化平台的API』。并发按平台压力动态限速，『原则上以保障开发者单并发正常使用为目标』。"
usage_restriction = "订阅套餐额度仅限在官方支持的编程工具 / Agent 中交互使用，禁止当作普通 API（自建应用、批量或程序化调用）使用；违规可能被限流或封禁。具体条款见 sources。"
sources = ["https://www.modelscope.cn/docs/model-service/API-Inference/limits", "https://www.modelscope.cn/docs/magicube/intro"]
