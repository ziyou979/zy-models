# zy-models: deploy the site to Cloudflare Workers with wrangler (instead of
# upstream's SST config). Build first: (cd packages/web && ./script/build.ts)
name = "zy-models"
main = "packages/function/src/zy-worker.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[assets]
directory = "packages/web/dist"
binding = "ASSETS"
# The worker decides routing (/, /models/..., /api.json → _api.json, ...).
run_worker_first = true
# Serve exactly the file the worker asks for (it requests /x/index.html, /_api.json, ...).
html_handling = "none"
not_found_handling = "none"

[observability]
enabled = true
